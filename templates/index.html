<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGenie — AI Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="badge">AI Learning Assistant</div>
      <h1>Edu<span>Genie</span></h1>
      <p>Ask questions, simplify concepts, generate quizzes, summarize text, and build learning paths.</p>
    </header>

    <section class="card">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Ask a Question</option>
        <option value="explain">Explain a Concept</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize Text</option>
        <option value="learn">Learning Path</option>
      </select>

      <label for="inputText">Your input</label>
      <textarea id="inputText" rows="9" placeholder="Example: Explain the Pythagoras theorem in simple words."></textarea>

      <button id="submitBtn" type="button">Generate Answer</button>
      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <section class="card result-card">
      <div class="result-heading">
        <h2>Result</h2>
        <button id="copyBtn" class="secondary" type="button" disabled>Copy</button>
      </div>
      <div id="result" class="result muted">Your AI-generated result will appear here.</div>
    </section>

    <footer>EduGenie • FastAPI + Google Gemini • Educational assistant</footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
